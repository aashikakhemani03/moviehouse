services:
  api:
    build:
      context: ./server
    environment:
      PORT: 5001
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/moviehouse}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080,http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5001"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5001}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - moviehouse-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  moviehouse-data: